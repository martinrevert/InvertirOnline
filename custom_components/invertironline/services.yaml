get_quote:
  name: Consultar cotización
  description: >-
    Consulta la cotización en tiempo real de un título, CEDEAR, bono o acción en
    InvertirOnline (IOL) para uso con Assist y automatizaciones.
  fields:
    simbolo:
      name: Símbolo
      description: Ticker o código del instrumento a consultar (ej. GGAL, AL30, SPY, AAPL).
      required: true
      example: "GGAL"
      selector:
        text:
    mercado:
      name: Mercado
      description: Mercado del instrumento (por defecto bCBA para bolsa argentina).
      required: false
      default: "bCBA"
      example: "bCBA"
      selector:
        select:
          options:
            - "bCBA"
            - "NYSE"
            - "NASDAQ"
          custom_value: true

get_portfolio:
  name: Consultar portafolio completo
  description: >-
    Obtiene en vivo el detalle normalizado de todas las posiciones abiertas en la
    cartera del usuario (ordenadas por valorizado) para Assist o automatizaciones.
  fields:
    pais:
      name: País
      description: Cartera a consultar (Argentina o Estados_Unidos).
      required: false
      default: "Argentina"
      example: "Argentina"
      selector:
        select:
          options:
            - "Argentina"
            - "Estados_Unidos"
    tipo:
      name: Tipo de activo (opcional)
      description: Filtro opcional por tipo de instrumento (ej. CEDEAR, Acciones, TitulosPublicos, FCI).
      required: false
      example: "CEDEAR"
      selector:
        text:
